<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — VisionFIT360</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="visionfit-landingpage-icon.png">
<link rel="apple-touch-icon" href="visionfit-landingpage-icon.png">
<style>
  :root {
    --white: #FFFFFF; --ink: #111111; --border: #EBEBEB; --gray: #AAAAAA;
    --soft: #F7F7F7; --blue: #2F7DE1; --blue-soft: #EAF2FD; --text-soft: #5B616B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--white); color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; width: 100%; }

  nav { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px); background: rgba(255,255,255,0.97); border-bottom: 1px solid var(--border); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.3px; }
  .brand img { width: 30px; height: 30px; border-radius: 7px; }
  .brand span b { color: var(--blue); }
  .nav-cta { background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; transition: opacity .2s; }
  .nav-cta:hover { opacity: 0.85; }

  main { flex: 1; display: grid; place-items: center; padding: 80px 0; text-align: center; }
  .code { font-size: clamp(64px, 14vw, 120px); font-weight: 800; letter-spacing: -4px; line-height: 1; color: var(--ink); }
  .code b { color: var(--blue); }
  h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 800; letter-spacing: -0.5px; margin-top: 10px; }
  p { color: var(--text-soft); font-size: 17px; margin: 14px auto 28px; max-width: 420px; }
  .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: transform .15s, box-shadow .2s, border-color .2s; }
  .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 8px 24px rgba(47,125,225,0.28); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(47,125,225,0.38); }
  .btn-ghost { border: 1px solid var(--border); color: var(--ink); background: var(--white); }
  .btn-ghost:hover { border-color: var(--ink); }

  footer { border-top: 1px solid var(--border); padding: 32px 0; color: var(--gray); font-size: 14px; }
  .foot-inner { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; align-items: center; }
  .foot-inner .brand span { color: var(--ink); }
  .foot-links { display: flex; gap: 22px; }
  .foot-links a { color: var(--gray); transition: color .2s; }
  .foot-links a:hover { color: var(--ink); }
</style>
</head>
<body>

<nav>
  <div class="wrap nav-inner">
    <a href="/" class="brand">
      <img src="visionfit-landingpage-icon.png" alt="VisionFIT360 logo">
      <span>Vision<b>FIT360</b></span>
    </a>
    <a href="/#download" class="nav-cta">Download app</a>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="code"><b>404</b></div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Back to home</a>
      <a href="/privacy" class="btn btn-ghost">Privacy Policy</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap foot-inner">
    <a href="/" class="brand"><img src="visionfit-landingpage-icon.png" alt="" style="width:24px;height:24px;border-radius:6px"> <span>Vision<b style="color:var(--blue)">FIT360</b></span></a>
    <div class="foot-links">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
    </div>
  </div>
</footer>

</body>
</html>
